<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover 是安全区（刘海 / 手势条）的前提：不声明就取不到 env(safe-area-inset-*) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <!-- 图集坐标的唯一来源（`npm run art` 的产物）：入场层的形象预览靠它的 `.sprite-*` 类 -->
    <link rel="stylesheet" href="/sprites/frames.css" />
    <title>云上睡眠大厅</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
