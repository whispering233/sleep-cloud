<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>失眠云 · 后台</title>
    <!-- 运维面：不加载前台 React、不连 WebSocket、不引用 DESIGN.md 的令牌（见 docs/api/30-api-admin.md §1）。 -->
    <link rel="stylesheet" href="admin.css" />
    <script src="admin.js" defer></script>
  </head>
  <body>
    <div class="app">
      <aside id="sidebar" hidden>
        <p class="brand">失眠云 · 后台</p>
        <nav>
          <a href="#identities">台账</a>
          <a href="#blocks">黑名单</a>
          <a href="#audit">审计</a>
          <a href="#reports">举报</a>
        </nav>
      </aside>

      <main>
        <div class="head">
          <h1>失眠云 · 后台</h1>
          <button type="button" id="logout" hidden>登出</button>
        </div>

        <form id="login">
          <div id="tokenField">
            <label for="token">后台令牌</label>
            <input id="token" name="token" type="password" autocomplete="current-password" required />
          </div>
          <div class="bar">
            <button type="submit">登录</button>
          </div>
        </form>

        <p id="status" role="status"></p>

        <div id="stats" class="stats" aria-label="概览" hidden></div>

        <div id="sections" hidden>
          <section id="view-identities">
            <h2>台账</h2>
            <div class="bar">
              <label for="ipFilter">按 IP 反查<input id="ipFilter" placeholder="1.2.3.4" autocomplete="off" /></label>
              <label for="nameFilter">按昵称搜<input id="nameFilter" placeholder="名字的一部分" autocomplete="off" /></label>
              <button type="button" id="ipSearch">搜索</button>
              <button type="button" id="ipClear">清除</button>
            </div>
            <div class="pager">
              <button type="button" id="identitiesPrev" disabled>上一页</button>
              <button type="button" id="identitiesNext" disabled>下一页</button>
            </div>
            <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>身份</th>
                  <th>昵称</th>
                  <th>最近出现</th>
                  <th>IP</th>
                  <th>国家</th>
                  <th>床号</th>
                  <th>在线</th>
                  <th>封禁</th>
                </tr>
              </thead>
              <tbody id="identities"></tbody>
            </table>
            </div>
          </section>

          <section id="view-blocks" hidden>
            <h2>黑名单</h2>
            <form id="blockForm">
              <div class="bar">
                <label for="blockKind">维度<select id="blockKind"><option value="user">user</option><option value="ip">ip</option></select></label>
                <label for="blockValue">值<input id="blockValue" required autocomplete="off" /></label>
                <label for="blockMinutes">时长（分钟，留空 = 永久）<input id="blockMinutes" type="number" min="1" inputmode="numeric" /></label>
                <label for="blockReason">原因<input id="blockReason" required maxlength="64" autocomplete="off" /></label>
                <button type="submit">封禁</button>
              </div>
            </form>
            <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>维度</th>
                  <th>值</th>
                  <th>到期</th>
                  <th>原因</th>
                  <th>创建</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="blocks"></tbody>
            </table>
            </div>
          </section>

          <section id="view-audit" hidden>
            <h2>审计</h2>
            <div class="pager">
              <button type="button" id="auditPrev" disabled>上一页</button>
              <button type="button" id="auditNext" disabled>下一页</button>
            </div>
            <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>时间</th>
                  <th>动作</th>
                  <th>维度</th>
                  <th>值</th>
                  <th>到期</th>
                  <th>原因</th>
                  <th>操作者</th>
                </tr>
              </thead>
              <tbody id="audit"></tbody>
            </table>
            </div>
          </section>

          <section id="view-reports" hidden>
            <h2>举报</h2>
            <h3>按被举报人</h3>
            <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>被举报人</th>
                  <th>次数</th>
                  <th>举报人数</th>
                  <th>最近一次</th>
                  <th>最近事由</th>
                </tr>
              </thead>
              <tbody id="reportTargets"></tbody>
            </table>
            </div>
            <h3>明细</h3>
            <div class="pager">
              <button type="button" id="reportsPrev" disabled>上一页</button>
              <button type="button" id="reportsNext" disabled>下一页</button>
            </div>
            <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>时间</th>
                  <th>次数</th>
                  <th>举报人</th>
                  <th>被举报人</th>
                  <th>事由</th>
                  <th>证据</th>
                </tr>
              </thead>
              <tbody id="reports"></tbody>
            </table>
            </div>
          </section>
        </div>
      </main>
    </div>

    <dialog id="drawer" aria-labelledby="drawerTitle">
      <div class="drawer-head">
        <h2 id="drawerTitle">台账详情</h2>
        <button type="button" id="drawerClose">关闭</button>
      </div>
      <div id="drawerBody"></div>
    </dialog>

    <p id="toast" role="status" aria-live="polite" hidden></p>
  </body>
</html>
